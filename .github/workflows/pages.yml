name: Legacy site verification (publishing disabled)

# Public publishing belongs exclusively to Rexy40407/vozen-org. The static
# tree in this repository is retained for legacy documentation/tests, but this
# workflow deliberately has no Pages permissions or deployment actions.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/minify-site.mjs'
      - 'site-tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-legacy-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild esbuild
      - run: npm run check:site
