name: CI

on:
  push:
    branches: [main, migration/vozen-rust]
  pull_request:

jobs:
  # Site-specific gate used by both pull requests and the Pages deployment. Keeping this
  # separate from the native bot matrix makes the deploy gate fast while still testing the
  # exact static bundle that will be uploaded.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Vitest loads esbuild. Rebuild only that audited binary after globally blocking
      # dependency install scripts, matching the allow-list posture of the main CI job.
      - run: npm rebuild esbuild
      - run: npm run check:site
        env:
          VOZEN_PUBLIC_CLIENT_ID: ${{ vars.VOZEN_PUBLIC_CLIENT_ID }}
          VOZEN_PUBLIC_API_ORIGIN: ${{ vars.VOZEN_PUBLIC_API_ORIGIN }}

  # Keep the Rust runtime independently verifiable from the static-site job.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup component add clippy rustfmt --toolchain 1.97.1
      - name: Audit locked runtime dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
      - run: npm run check:rust-contracts
      - run: node tools/check-vendored-voice.mjs
      - name: Build the unmodified published Davey interoperability peer
        run: CARGO_TARGET_DIR="$PWD/target" cargo build --manifest-path vendor/davey/tests/legacy-peer/Cargo.toml --locked
      - name: Verify DAVE MLS compatibility and authenticated audio
        timeout-minutes: 5
        env:
          VOZEN_LEGACY_DAVE_PEER: ${{ github.workspace }}/target/debug/vozen-dave-legacy-peer
        run: CARGO_TARGET_DIR="$PWD/target" cargo test --manifest-path vendor/davey/Cargo.toml --locked --lib
      - name: Verify scoped Cloudflare API proxy renderer
        run: python3 -m unittest discover -s deploy/cloudflare -p 'test_api_proxy.py' -v
      - run: npm run check:rust-canaries
      - run: npm run check:rust
      # The portable Rust build deliberately omits Songbird's native Opus driver. Verify the
      # production voice feature separately on Linux, where CMake and the compiler toolchain are
      # present, so a control-plane-only green build can never hide a broken voice cutover.
      - run: cmake --version
      - run: npm run check:rust-voice
      # The VPS image is optimized; keep the release + Songbird path green in CI as well.
      - run: cargo test --release -p vozen-runtime --features voice-driver

  # Build the same Linux image used by the explicit Rust staging override. This is intentionally
  # separate from the runtime tests: a Windows/MSVC build can pass while the Debian/Opus image
  # still has a broken Docker context, native dependency or healthcheck asset.
  rust-image:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: >-
          docker build --build-arg "VOZEN_REVISION=$GITHUB_SHA"
          --file Dockerfile.rust --tag "vozen-rust:$GITHUB_SHA" .
      # Start the real entrypoint in a credential-free smoke mode. The mode opens a temporary
      # SQLite store and local /health listener but never creates a Discord gateway session.
      - name: Start runtime image smoke test
        shell: bash
        run: |
          set -euo pipefail
          container="vozen-rust-smoke-${GITHUB_RUN_ID}"
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container" --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env RUST_IMAGE_SMOKE=true \
            --env HEALTH_PORT=8080 \
            "vozen-rust:$GITHUB_SHA" >/dev/null
          for attempt in {1..30}; do
            if docker exec "$container" /usr/local/bin/healthcheck-rust.sh; then
              echo "runtime image smoke test passed"
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          echo "runtime image smoke test did not become ready" >&2
          exit 1
      - name: Verify production entrypoint remains credential-gated
        shell: bash
        run: |
          set +e
          output="$(docker run --rm "vozen-rust:$GITHUB_SHA" 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          grep -Fq "DISCORD_TOKEN" <<<"$output"
      - name: Export immutable production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/migration/vozen-rust'
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/vozen-rust-$GITHUB_SHA.tar.gz"
          docker image save "vozen-rust:$GITHUB_SHA" | gzip --fast > "$artifact"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$(basename "$artifact")" > "$(basename "$artifact").sha256"
          )
      - name: Upload immutable production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/migration/vozen-rust'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vozen-rust-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vozen-rust-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/vozen-rust-${{ github.sha }}.tar.gz.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          overwrite: true
