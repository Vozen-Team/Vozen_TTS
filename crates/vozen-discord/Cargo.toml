[package]
name = "vozen-discord"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Enables actual Discord voice transport. It needs libopus (and CMake/a C compiler only when
# libopus cannot be obtained from the operating system). Kept opt-in so the control-plane and
# parity tests remain portable on developer machines.
voice-driver = [
    "songbird/driver",
    "songbird/builtin-queue",
    "songbird/tungstenite",
    "songbird/receive",
]

[dependencies]
async-trait.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
serenity.workspace = true
songbird.workspace = true
symphonia.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
vozen-contracts = { path = "../vozen-contracts" }
vozen-core = { path = "../vozen-core" }
vozen-store = { path = "../vozen-store" }

[lints]
workspace = true

[dev-dependencies]
ringbuf = "=0.5.3"
